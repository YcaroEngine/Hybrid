name: Compilar Hybrid

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Compilar server.jar
        run: mvn -B -s settings.xml package
      - name: Publicar server.jar direto na Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Hybrid ALL-VERSIONS (Latest Build)
          files: target/server.jar
          make_latest: true
